name: Update German M3U

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV-org Germany playlist
        run: |
          curl -L \
            "https://iptv-org.github.io/iptv/countries/de.m3u" \
            -o /tmp/germany.m3u

      - name: Copy playlist
        run: |
          cp /tmp/germany.m3u deutsch.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deutsch.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update German M3U"
            git push
          fi
